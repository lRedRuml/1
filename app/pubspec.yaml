name: vpnonline_app
description: VPN onLine — клиентское приложение (Android/iOS/Windows/macOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  # [НОВОЕ] нужны для: онбординга/флага "первый запуск", открытия
  # payment_url в системном браузере/webview при покупке.
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  # [НОВОЕ v4] Хранилище JWT-токена — Keychain на iOS/macOS, Keystore на
  # Android, Credential Manager на Windows. Раньше токен вообще негде было
  # хранить, потому что не было экрана входа (см. auth_screen.dart) — JWT
  # НЕЛЬЗЯ класть в SharedPreferences (это открытый файл на диске, не
  # защищённое хранилище — прямое требование из harness-промпта про секреты).
  flutter_secure_storage: ^9.2.2
  # [НОВОЕ v4.2] Реальный VLESS/Reality-туннель — Android/iOS/macOS/Windows
  # из коробки, MIT, поддерживает VPN и proxy-only режим. Выбран вместо
  # ручного JNI/Go-биндинга к sing-box, потому что: (а) писать и связывать
  # Kotlin<->Go biнding вручную здесь, без Android SDK/Go toolchain и
  # реального устройства для проверки, — очень высокий риск получить
  # нерабочий/несобирающийся код; (б) этот пакет официально числится в
  # README самого Xray-core как поддерживающий VLESS+XTLS+Reality, активно
  # обновляется и уже протестирован авторами на реальных устройствах по
  # всем 4 протоколам, включая TCP/Reality. См. app/NATIVE_SETUP.md —
  # без ручной настройки на каждой платформе (App Group + Network
  # Extension на iOS/macOS через Xcode, xray.exe на Windows) само по себе
  # добавление в pubspec.yaml НЕ включит VPN — платформенные шаги нельзя
  # выполнить только правкой файлов.
  flutter_vless: ^1.1.1
  # [НОВОЕ] Реальный список установленных приложений для split-tunnel
  # экрана (см. screens/split_tunnel_screen.dart) — раньше там был
  # фиксированный демо-список из 5 названий, не имевший отношения к
  # реальному устройству. API v2.0.0+ — именованные аргументы
  # (excludeSystemApps/excludeNonLaunchableApps). Только Android — на
  # iOS/macOS/Windows методы пакета возвращают пустой список/заглушку,
  # экран обрабатывает это отдельной веткой.
  installed_apps: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # [НОВОЕ] Генерация иконки приложения (щит в фирменных цветах) для всех
  # платформ из одного PNG — см. assets/icon/ и flutter_launcher_icons:
  # ниже. Запускается один раз командой:
  #   dart run flutter_launcher_icons
  # (или отдельным шагом в CI — см. .github/workflows/build-android.yml).
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Конфиг flutter_launcher_icons: генерирует mipmap/AppIcon.appiconset/etc.
# из одного источника. image_path — полная иконка (фигура + фон, глубокий
# чёрный с фиолетово-мадженным свечением, см. app_icon.png) для iOS/macOS/
# Windows/web, где адаптивных иконок нет. Для Android отдельно собирается
# adaptive icon: непрозрачный foreground (только сам щит, без фона —
# app_icon_foreground.png) поверх сплошного фонового цвета бренда —
# так контур щита не обрезается разными масками формы иконки на разных
# лаунчерах Android.
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#05030A"
    theme_color: "#B026FF"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#05030A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
