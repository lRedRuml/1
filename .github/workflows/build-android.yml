  - name: Setup JDK
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Flutter (official)
    uses: flutter-actions/setup-flutter@v2
    with:
      channel: stable

  - name: Show Flutter version
    run: flutter --version

  - name: Flutter pub get
    run: flutter pub get

  - name: Flutter analyze
    run: flutter analyze || true

  - name: Run tests
    run: flutter test --coverage || true

  - name: Build debug APK
    run: flutter build apk --debug --no-shrink

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: build/app/outputs/flutter-apk/app-debug.apk

  - name: Prepare signed release (if keystore provided)
    if: secrets.ANDROID_KEYSTORE_BASE64 != ''
    run: mkdir -p android/keystore && echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/keystore.jks && printf 'storeFile=android/keystore/keystore.jks\nstorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\nkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}\nkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}\n' > android/key.properties

  - name: Build release APK (signed if keystore present)
    run: if [ -f android/keystore/keystore.jks ]; then flutter build apk --release --no-shrink --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}; else echo "Keystore not found, building unsigned release APK" && flutter build apk --release --no-shrink --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}; fi

  - name: Upload release APK
    uses: actions/upload-artifact@v4
    with:
      name: app-release-apk
      path: build/app/outputs/flutter-apk/app-release.apk