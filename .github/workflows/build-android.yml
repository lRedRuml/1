name: Android Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Complete Recreate Native Project Infrastructure
        run: |
          flutter clean
          rm -rf android
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter pub get
          flutter create --platforms=android --org su.vpnonline --project-name vpnonline_app .

      - name: Decode release keystore (if secrets are set)
        run: |
          # [ИСПРАВЛЕНО — реальный баг] Раньше release-сборка ВСЕГДА
          # подписывалась debug-ключом (signingConfigs.debug), несмотря на
          # то что в репозитории лежит подготовленный настоящий
          # release-keystore и 4 секрета под него (см. signing/SIGNING_SECRETS.txt).
          # Вся подготовка ключа была бесполезна — собранный APK всё равно
          # был бы debug-подписанным. Если секреты заданы — кладём keystore
          # и key.properties, build.gradle ниже сам подхватит их условно
          # (и НЕ упадёт на PR из форков, где секретов нет — тогда останется
          # debug-подпись, это ожидаемо для непубличных сборок).
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties << PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан debug-ключом (годится для теста на своём телефоне, НЕ годится для Google Play/обновления ранее опубликованного APK)."
          fi

      - name: Force Fix Android Namespace and Kotlin Constraints
        run: |
          # 1. Жестко переписываем системный файл свойств local.properties для переопределения переменных Flutter CLI
          PROPERTIES_PATH="android/local.properties"
          echo "flutter.sdk=$FLUTTER_ROOT" > "$PROPERTIES_PATH"
          echo "flutter.buildMode=release" >> "$PROPERTIES_PATH"
          echo "flutter.versionName=1.0.0" >> "$PROPERTIES_PATH"
          echo "flutter.versionCode=1" >> "$PROPERTIES_PATH"
          echo "flutter.minSdkVersion=26" >> "$PROPERTIES_PATH"
          echo "flutter.targetSdkVersion=34" >> "$PROPERTIES_PATH"
          echo "flutter.compileSdkVersion=34" >> "$PROPERTIES_PATH"

          # 2. Переписываем корневой build.gradle под современный Kotlin 1.9
          cat << 'EOF' > android/build.gradle
          buildscript {
              ext.kotlin_version = '1.9.20'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 3. Переписываем сборочный файл приложения с использованием официальных динамических свойств Flutter
          cat << 'EOF' > android/app/build.gradle
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              flutterRoot = System.getenv('FLUTTER_ROOT')
          }
          def flutterMinSdkVersion = localProperties.getProperty('flutter.minSdkVersion')
          if (flutterMinSdkVersion == null) {
              flutterMinSdkVersion = '26'
          }
          def flutterTargetSdkVersion = localProperties.getProperty('flutter.targetSdkVersion')
          if (flutterTargetSdkVersion == null) {
              flutterTargetSdkVersion = '34'
          }
          def flutterCompileSdkVersion = localProperties.getProperty('flutter.compileSdkVersion')
          if (flutterCompileSdkVersion == null) {
              flutterCompileSdkVersion = '34'
          }

          // [НОВОЕ] Условная реальная подпись — см. шаг "Decode release
          // keystore" выше. hasReleaseSigning=false (файла key.properties
          // нет) на PR из форков и локальных сборках без секретов — тогда
          // остаётся debug-подпись, сборка не падает.
          def keystorePropertiesFile = rootProject.file('key.properties')
          def keystoreProperties = new Properties()
          def hasReleaseSigning = keystorePropertiesFile.exists()
          if (hasReleaseSigning) {
              keystorePropertiesFile.withReader('UTF-8') { reader ->
                  keystoreProperties.load(reader)
              }
          }

          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

          android {
              namespace "su.vpnonline.vpnonline_app"
              compileSdkVersion flutterCompileSdkVersion.toInteger()
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {
                  applicationId "su.vpnonline.vpnonline_app"
                  minSdkVersion flutterMinSdkVersion.toInteger()
                  targetSdkVersion flutterTargetSdkVersion.toInteger()
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  if (hasReleaseSigning) {
                      release {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      // [ИСПРАВЛЕНО] Раньше здесь БЕЗУСЛОВНО стояло
                      // signingConfigs.debug — реальный release-keystore из
                      // signing/ никогда не использовался, даже если секреты
                      // были заданы правильно.
                      signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20"
          }
          EOF

      - name: Inject Valid VPN Production AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          cat << 'EOF' > "$MANIFEST_PATH"
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="su.vpnonline.vpnonline_app">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.BIND_VPN_SERVICE" />
              
              <application
                  android:label="VPN Online"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Build Production APK via Flutter Core
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          flutter build apk --release \
            --no-tree-shake-icons \
            --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.vpnonline.shop/api/v1' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
