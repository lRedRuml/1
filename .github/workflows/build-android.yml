name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Missing Icon Asset Directory
        run: |
          mkdir -p app/assets/icon
          # Генерация резервной заглушки иконки, если физический файл отсутствует в коммите
          if [ ! -f app/assets/icon/icon.png ]; then
            echo "Creating a fallback blank icon placeholder to prevent build failure..."
            convert -size 512x512 xc:#b026ff app/assets/icon/icon.png || touch app/assets/icon/icon.png
          fi

      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Generate launcher icons
        run: |
          cd app
          # Использование актуального синтаксиса выполнения пакетов во Flutter 3.x
          flutter pub run flutter_launcher_icons

      - name: Build Release APK
        run: |
          cd app
          flutter build apk --release \
            --dart-define=SHOPBOT_API_KEY="${{ secrets.SHOPBOT_API_KEY || 'default_fallback_secure_key_2026' }}" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL || 'https://vpnonline.shop' }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
